name: testler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      # Testler API anahtari GEREKTIRMEZ: veri conftest tarafindan uretiliyor,
      # model cagrilari sahte modelle yapiliyor. CI'da gizli anahtar yok.
      - name: Testleri calistir
        # `python -m pytest` (duz `pytest` degil): calisilan dizini arama
        # yoluna ekler, yoksa `import src` CI'da ModuleNotFoundError verir.
        run: python -m pytest tests/ -q
